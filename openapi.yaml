openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: episodes
    description: Podcast episodes
  - name: newsletter
    description: Newsletter subscription
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /episodes:
    get:
      operationId: getEpisodes
      tags: [episodes]
      summary: Get latest episodes
      description: Returns the latest episodes from the Spotify show feed
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: List of episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodesResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterError"
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter
      description: Adds an email address to the Mailchimp audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeRequest"
      responses:
        "200":
          description: Successfully subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "400":
          description: Validation error or already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterError"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Episode:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        duration:
          type: string
        episode_number:
          type: integer
          nullable: true
        release_date:
          type: string
          nullable: true
        spotify_url:
          type: string
          nullable: true
        audio_url:
          type: string
          nullable: true
      required:
        - id
        - title
        - description
        - duration
    EpisodesResponse:
      type: object
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
        source:
          type: string
      required:
        - episodes
        - source
    NewsletterSubscribeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          nullable: true
      required:
        - email
    NewsletterSubscribeResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: string
      required:
        - message
        - status
    NewsletterError:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail
